<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="Consolas, 'Courier New', monospace">
  <rect width="900" height="210" fill="#1C1C1C"/>
  <text x="20" y="30" fill="#FFFFEC" font-size="18">Thunderbirds: Heavy Lift — palette (sampled from the 1985 C64 original)</text>

  <g font-size="12" fill="#FFFFEC">
    <rect x="20"  y="50" width="90" height="90" fill="#101010" stroke="#555" stroke-width="1"/>
    <text x="20"  y="160">tombVoid</text><text x="20"  y="176">#101010</text>

    <rect x="120" y="50" width="90" height="90" fill="#E0A040"/>
    <text x="120" y="160">sandstone</text><text x="120" y="176">#E0A040</text>

    <rect x="220" y="50" width="90" height="90" fill="#785828"/>
    <text x="220" y="160">sandShadow</text><text x="220" y="176">#785828</text>

    <rect x="320" y="50" width="90" height="90" fill="#A0A0FF" stroke="#101010" stroke-width="6"/>
    <text x="320" y="160">blockBlue</text><text x="320" y="176">#A0A0FF</text>

    <rect x="420" y="50" width="90" height="90" fill="#FFFF40" stroke="#101010" stroke-width="6"/>
    <text x="420" y="160">blockYellow</text><text x="420" y="176">#FFFF40</text>

    <rect x="520" y="50" width="90" height="90" fill="#E04040" stroke="#101010" stroke-width="6"/>
    <text x="520" y="160">blockRed</text><text x="520" y="176">#E04040</text>

    <rect x="620" y="50" width="90" height="90" fill="#40E040"/>
    <text x="620" y="160">dockLit</text><text x="620" y="176">#40E040</text>

    <rect x="720" y="50" width="70" height="90" fill="#888888"/>
    <text x="720" y="160">uiMuted</text><text x="720" y="176">#888888</text>

    <rect x="800" y="50" width="80" height="90" fill="#FFFFEC"/>
    <text x="800" y="160">uiText</text><text x="800" y="176">#FFFFEC</text>
  </g>
  <text x="20" y="200" fill="#888888" font-size="11">Block swatches show the thick dark per-block border used in-game.</text>
</svg>
